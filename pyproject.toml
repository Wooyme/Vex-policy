[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vex-policy"
version = "0.1.0"
description = "MQTT-controlled policy inference for Unitree humanoid robots"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "defusedxml>=0.7",
    "far-unitree-sdk==0.1.4",
    "loguru>=0.7",
    "numpy>=1.26,<3",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "paho-mqtt>=2,<3",
    "pin>=3,<5",
    "pydantic>=2.8,<3",
    "pyyaml>=6",
    "pyzmq>=26",
    "termcolor>=2.4",
]

[project.optional-dependencies]
unitree-high-level = [
    "unitree-sdk2py @ git+https://github.com/unitreerobotics/unitree_sdk2_python.git@65691c8a8bc53b98d3976dba4dbf9d5d20b2e7f5",
]

[dependency-groups]
dev = [
    "build>=1.2",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.12",
]

[project.scripts]
vex-policy = "vex_policy.cli:main"

[project.entry-points."vex_policy.sdk"]
unitree = "vex_policy.sdk.unitree.unitree_interface:UnitreeInterface"
unitree_mp = "vex_policy.sdk.unitree.unitree_interface_mp:UnitreeInterfaceMP"

[project.entry-points."vex_policy.policies"]
locomotion = "vex_policy.policies.locomotion:LocomotionPolicy"
wbt = "vex_policy.policies.wbt:WholeBodyTrackingPolicy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vex_policy = [
    "py.typed",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 20
