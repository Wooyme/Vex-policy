name: bfm-token-passive-walk
implementation: bfm_token_passive_walk
type: full_body
# Command-free: the robot follows a hand tether; the tether state is training-only (critic) input.
inputs: []
observation:
  obs_dict:
    actor_obs: [ frame ]
    phase_obs: [ cos_phase, sin_phase ]
    latent_history_obs: [ latent ]
  obs_dims: { frame: 93, cos_phase: 2, sin_phase: 2, latent: 256 }
  obs_scales: { frame: 1.0, cos_phase: 1.0, sin_phase: 1.0, latent: 1.0 }
  history_length_dict: { actor_obs: 4, phase_obs: 1, latent_history_obs: 1 }
task:
  # TEMPLATE: select a Holosoma g1_bfm_token_passive_walk controller; its export is 632 -> [token, codeword][257].
  # The learned codewords are inside the export, so no vocabulary is needed.
  # Convert the frozen actor using vex-bfm-export-actor (normalization and x5 included).
  # All asset paths are relative to the process working directory.
  model_path: models/bfm/controller/walk_token_passive.onnx
  actor_model_path: models/bfm/actor.onnx
  rl_rate: 50.0
  controller_decimation: 4
  gait_period: 1.0
  inference_provider: cpu
  inference_threads: 1
