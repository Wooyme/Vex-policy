name: bfm-wrist-student
implementation: bfm_wrist_student
type: full_body
# Goal-free: the robot follows the operator's pull on a wrist; wrist goals were teacher-only.
inputs: []
observation:
  obs_dict:
    student_obs: [ frame ]
    phase_obs: [ cos_phase, sin_phase ]
    latent_history_obs: [ latent ]
  obs_dims: { frame: 93, cos_phase: 2, sin_phase: 2, latent: 256 }
  obs_scales: { frame: 1.0, cos_phase: 1.0, sin_phase: 1.0, latent: 1.0 }
  # Six 12.5 Hz controller steps of frames (0.48 s), oldest first.
  history_length_dict: { student_obs: 6, phase_obs: 1, latent_history_obs: 1 }
task:
  # TEMPLATE: select a Holosoma g1_29dof_bfm_wrist_student export; it is 818 -> [token, codeword][257].
  # The learned codewords are inside the export, so no vocabulary is needed.
  # Convert the frozen actor using vex-bfm-export-actor (normalization and x5 included).
  # All asset paths are relative to the process working directory.
  model_path: models/bfm/controller/wrist_student.onnx
  actor_model_path: models/bfm/actor.onnx
  rl_rate: 50.0
  controller_decimation: 4
  gait_period: 1.0
  inference_provider: cpu
  inference_threads: 1
