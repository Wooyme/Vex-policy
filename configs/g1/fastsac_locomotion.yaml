name: g1-fastsac-locomotion
implementation: locomotion
type: full_body
inputs:
- vx
- vy
- yaw
observation:
  obs_dict:
    actor_obs:
    - base_ang_vel
    - projected_gravity
    - command_lin_vel
    - command_ang_vel
    - dof_pos
    - dof_vel
    - actions
    - sin_phase
    - cos_phase
  obs_dims:
    base_lin_vel: 3
    base_ang_vel: 3
    projected_gravity: 3
    command_lin_vel: 2
    command_ang_vel: 1
    dof_pos: 29
    dof_vel: 29
    actions: 29
    sin_phase: 2
    cos_phase: 2
  obs_scales:
    base_lin_vel: 2.0
    base_ang_vel: 0.25
    projected_gravity: 1.0
    command_lin_vel: 1.0
    command_ang_vel: 1.0
    dof_pos: 1.0
    dof_vel: 0.05
    actions: 1.0
    sin_phase: 1.0
    cos_phase: 1.0
  history_length_dict:
    actor_obs: 1
task:
  model_path: models/loco/g1_29dof/fastsac_g1_29dof.onnx
  rl_rate: 50.0
  policy_action_scale: 0.25
  action_scales_by_effort_limit_over_p_gain: false
  use_phase: true
  gait_period: 1.0
  skip_stiff_prompt: true
  auto_walk_on_vel_cmd: true
  use_sim_time: false
  desired_base_height: 0.75
  residual_upper_body_action: false
  print_observations: false
  motion_start_timestep: 0
  motion_end_timestep: null
  debug:
    force_upright_imu: false
    force_zero_angular_velocity: false
    force_zero_action: false

